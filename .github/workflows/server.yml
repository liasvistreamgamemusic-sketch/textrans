name: server
on:
  push:
    paths: ["server/**", "protocol/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "protocol/**", ".github/workflows/server.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
