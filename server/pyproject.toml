[project]
name = "voice-server"
version = "0.1.0"
description = "音声入力システム: Gateway (ASR + LLM清書) サーバー"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "websockets>=13,<14",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pyyaml>=6.0,<7.0",
  "jsonschema>=4.23,<5.0",
  "numpy>=1.26,<2.0",
  "httpx>=0.27,<1.0",
  "typer>=0.13,<1.0",
  "cryptography>=43.0,<44.0",
]

[project.optional-dependencies]
# faster-whisper (CTranslate2) 本番 ASR バックエンド。GPU/CTranslate2 依存が重いため既定 sync から外す。
gpu = [
  "faster-whisper>=1.0,<2.0",
]
# Silero VAD。torch(CPU) 依存があるため既定 sync から外す。mac のテストは VAD をスタブに差し替えて実行する。
vad = [
  "silero-vad>=5.1,<6.0",
  "torch>=2.4,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
  "respx>=0.21,<1.0",
]

[project.scripts]
voice-server = "voice_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer の推奨パターン (Option()/Argument() を引数既定値に置く) は B008 の意図する
# ミュータブルデフォルト対策の対象外。typer 自身がこの形を前提に動く。
"src/voice_server/cli.py" = ["B008"]
